<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign — SHILL VAULT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<nav id="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo"><div class="logo-mark">SV</div><span class="logo-name">SHILL VAULT</span></a>
    <button class="mob-toggle" onclick="$('.nav-links')?.classList.toggle('active')" aria-label="Menu">&#9776;</button>
    <ul class="nav-links"></ul>
  </div>
</nav>

<div class="detail-wrap">
  <a href="index.html#campaigns" class="detail-back">&larr; 캠페인 목록</a>

  <div id="loading" class="dash-loading"><div class="spinner"></div></div>

  <div id="content" style="display:none;">
    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;">
      <div class="tr-picon" id="campIcon" style="width:44px;height:44px;font-size:0.85rem;"></div>
      <div>
        <h1 class="detail-title" id="campName"></h1>
        <div class="detail-meta">
          <span id="campChain"></span>
          <span id="campCategory"></span>
          <span id="campStatus"></span>
        </div>
      </div>
    </div>

    <p id="campDesc" style="font-size:0.9rem;color:var(--text-2);margin-bottom:1.5rem;line-height:1.65;"></p>

    <!-- Campaign Details -->
    <div class="dash-card">
      <div class="dash-card-title">캠페인 상세 정보</div>
      <div class="camp-info-grid" id="campInfoGrid"></div>
    </div>

    <!-- Quests -->
    <div class="dash-card">
      <div class="dash-card-title">퀘스트 목록 <span class="count" id="questCountBadge">0</span></div>
      <div class="quest-list" id="questList"></div>
      <div id="questEmpty" class="dash-empty" style="display:none;">
        <div class="dash-empty-icon">&#128270;</div>
        <p>등록된 퀘스트가 없습니다.</p>
      </div>
    </div>
  </div>

  <div id="notFound" style="display:none;">
    <div class="dash-empty">
      <div class="dash-empty-icon">&#128533;</div>
      <p>캠페인을 찾을 수 없습니다.</p>
      <a href="index.html" class="btn btn-ghost" style="margin-top:1rem;">홈으로</a>
    </div>
  </div>
</div>

<!-- Wallet Modal -->
<div class="modal-overlay" id="walletModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('walletModal')">&times;</button>
    <div id="walletConnect">
      <h3>지갑 연결</h3>
      <p class="modal-desc">지갑을 연결하여 퀘스트에 참여하세요.</p>
      <div class="wallet-options" id="walletOptions"></div>
      <div id="walletError" class="wallet-error" style="display:none;"></div>
    </div>
    <div id="walletRegister" style="display:none;"></div>
    <div id="walletInfo" style="display:none;">
      <h3>지갑 연결됨</h3>
      <p class="modal-desc" id="wiAddr"></p>
      <button class="wallet-disconnect-btn" onclick="doDisconnect()">연결 해제</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const campaignId = params.get('id');

  // Label mappings
  const CATEGORY_LABELS = { defi:'DeFi', nft:'NFT / Collectibles', gamefi:'GameFi', l1l2:'L1/L2 · Infra', ai:'AI · DePIN', meme:'Meme Token', other:'기타' };
  const CHAIN_LABELS = { ethereum:'Ethereum', solana:'Solana', base:'Base', arbitrum:'Arbitrum', bnb:'BNB Chain', polygon:'Polygon', multi:'멀티체인', other:'기타' };
  const TOKEN_LABELS = { usdt:'USDT', USDT:'USDT', token:'자체 토큰', TOKEN:'자체 토큰', nft:'NFT', NFT:'NFT', point:'포인트', POINT:'포인트' };

  // Quest type mappings
  const QUEST_EMOJI = {
    twitter_follow: '🐦', twitter_rt: '🔁', telegram_join: '✈️', discord_join: '💬',
    token_swap: '🔄', staking: '📌', nft_mint: '🎨',
    review: '📝', twitter_thread: '🧵', other_content: '📋',
  };
  const ACTION_LABELS = {
    twitter_follow: '트위터 팔로우', twitter_rt: 'RT & 좋아요', telegram_join: '텔레그램 가입',
    discord_join: '디스코드 참여', token_swap: '스왑 체험', staking: '스테이킹', nft_mint: 'NFT 민팅',
    review: '리뷰 작성', twitter_thread: '트위터 스레드', other_content: '기타 콘텐츠',
  };
  const KOL_ACTIONS = ['review', 'twitter_thread', 'other_content'];

  let myParticipations = {};

  async function loadMyParticipations() {
    if (!Auth.isLoggedIn) return;
    try {
      const data = await api('/api/users/me/participations');
      if (Array.isArray(data)) {
        data.forEach(p => { myParticipations[p.quest_id] = p.status; });
      }
    } catch { /* not logged in or error */ }
  }

  async function loadCampaign() {
    if (!campaignId) { hide('#loading'); show('#notFound'); return; }
    try {
      const [camp] = await Promise.all([
        api('/api/campaigns/' + campaignId),
        loadMyParticipations(),
      ]);
      hide('#loading');
      show('#content');

      const abbr = (camp.project_name || '').slice(0, 2).toUpperCase();
      const gradients = ['#6366f1,#818cf8','#f59e0b,#fbbf24','#ec4899,#f472b6','#22d3ee,#06b6d4'];
      const grad = gradients[camp.project_name?.length % gradients.length || 0];
      $('#campIcon').style.background = 'linear-gradient(135deg,' + grad + ')';
      $('#campIcon').textContent = abbr;
      $('#campName').textContent = camp.project_name;
      $('#campChain').textContent = CHAIN_LABELS[camp.chain] || camp.chain || '-';
      $('#campCategory').textContent = CATEGORY_LABELS[camp.category] || camp.category || '-';
      $('#campStatus').innerHTML = statusBadge(camp.status);
      if (camp.description) $('#campDesc').textContent = camp.description;
      else hide('#campDesc');

      document.title = (camp.project_name || 'Campaign') + ' — SHILL VAULT';

      // Render detailed info grid
      renderCampInfo(camp);

      // Render quests
      const quests = camp.quests || [];
      $('#questCountBadge').textContent = quests.length;

      if (quests.length === 0) {
        show('#questEmpty');
      } else {
        renderQuests(quests);
      }
    } catch (e) {
      hide('#loading');
      show('#notFound');
    }
  }

  function renderCampInfo(camp) {
    const grid = document.getElementById('campInfoGrid');
    const r = (label, value) => '<div class="camp-info-item"><span class="camp-info-label">' + label + '</span><span class="camp-info-value">' + value + '</span></div>';

    let html =
      r('프로젝트명', camp.project_name || '-') +
      r('상태', statusBadge(camp.status)) +
      r('카테고리', CATEGORY_LABELS[camp.category] || camp.category || '-') +
      r('체인', CHAIN_LABELS[camp.chain] || camp.chain || '-') +
      r('보상 토큰', TOKEN_LABELS[camp.reward_token] || camp.reward_token || '-') +
      r('총 예산', '$' + formatNum(camp.reward_amount)) +
      r('최대 참여자', camp.max_participants ? formatNum(camp.max_participants) + '명' : '제한 없음') +
      r('현재 참여자', formatNum(camp.current_participants) + '명') +
      r('캠페인 기간', formatDate(camp.start_date) + ' ~ ' + formatDate(camp.end_date)) +
      r('생성일', formatDate(camp.created_at));

    // KOL follower requirements
    const fmtF = (n) => n >= 1000 ? (n / 1000) + 'K+' : n + '+';
    if (camp.min_twitter_followers > 0 || camp.min_telegram_followers > 0) {
      const tw = camp.min_twitter_followers ? fmtF(camp.min_twitter_followers) : '-';
      const tg = camp.min_telegram_followers ? fmtF(camp.min_telegram_followers) : '-';
      html += r('KOL 트위터 최소', tw) + r('KOL 텔레그램 최소', tg);
    }

    // Per-quest reward breakdown
    const quests = camp.quests || [];
    if (quests.length > 0) {
      const rewardList = quests.map(q => {
        const label = ACTION_LABELS[q.action_type] || q.title || q.action_type;
        return label + ': $' + (q.reward_per_user || 0);
      }).join(', ');
      html += '<div class="camp-info-item camp-info-full"><span class="camp-info-label">퀘스트별 보상 단가</span><span class="camp-info-value">' + rewardList + '</span></div>';
    }

    if (camp.description) {
      html += '<div class="camp-info-item camp-info-full"><span class="camp-info-label">설명</span><span class="camp-info-value">' + camp.description + '</span></div>';
    }

    grid.innerHTML = html;
  }

  function renderQuests(quests) {
    const general = quests.filter(q => !KOL_ACTIONS.includes(q.action_type));
    const kol = quests.filter(q => KOL_ACTIONS.includes(q.action_type));

    const list = $('#questList');
    list.innerHTML = '';

    if (general.length > 0) {
      const header = document.createElement('div');
      header.className = 'quest-group-header';
      header.innerHTML = '<span class="quest-group-icon">&#128100;</span> 일반 유저 퀘스트';
      list.appendChild(header);
      general.forEach(q => list.appendChild(createQuestItem(q)));
    }

    if (kol.length > 0) {
      const header = document.createElement('div');
      header.className = 'quest-group-header';
      header.innerHTML = '<span class="quest-group-icon">&#11088;</span> 인플루언서(KOL) 퀘스트';
      list.appendChild(header);
      kol.forEach(q => list.appendChild(createQuestItem(q)));
    }
  }

  function createQuestItem(q) {
    const emoji = QUEST_EMOJI[q.action_type] || '📋';
    const typeClass = 'quest-type-' + (q.quest_type || 'social');
    const actionLabel = ACTION_LABELS[q.action_type] || q.action_type || q.quest_type || '-';
    const myStatus = myParticipations[q.id];

    let btnHtml;
    if (myStatus === 'completed' || myStatus === 'rewarded') {
      btnHtml = '<button class="quest-join-btn completed" disabled>완료</button>';
    } else if (myStatus === 'joined') {
      btnHtml = '<button class="quest-join-btn joined" disabled>참여중</button>';
    } else if (!Auth.isLoggedIn) {
      btnHtml = '<button class="quest-join-btn connect" onclick="openModal(\'walletModal\')">지갑 연결</button>';
    } else if (Auth.isProject) {
      btnHtml = '';
    } else {
      btnHtml = '<button class="quest-join-btn" onclick="joinQuest(\'' + q.id + '\', this)">참여하기</button>';
    }

    const item = document.createElement('div');
    item.className = 'quest-item';
    item.id = 'quest-' + q.id;
    item.innerHTML = `
      <div class="quest-type-badge ${typeClass}">${emoji}</div>
      <div class="quest-item-body">
        <div class="quest-item-title">${q.title || q.name || actionLabel}</div>
        <div class="quest-item-meta">
          <span>${actionLabel}</span>
          <span>${q.reward_per_user ? '$' + q.reward_per_user + ' 보상' : '보상 미정'}</span>
          <span>${formatNum(q.current_participants)}${q.max_participants ? ' / ' + formatNum(q.max_participants) : ''}명</span>
        </div>
      </div>
      ${btnHtml}`;
    return item;
  }

  async function joinQuest(questId, btn) {
    btn.disabled = true;
    btn.textContent = '참여 중...';
    try {
      await api('/api/quests/' + questId + '/join', { method: 'POST' });
      btn.className = 'quest-join-btn joined';
      btn.textContent = '참여중';
      myParticipations[questId] = 'joined';
      const item = document.getElementById('quest-' + questId);
      if (item) {
        const meta = item.querySelectorAll('.quest-item-meta span');
        if (meta[2]) {
          const match = meta[2].textContent.match(/^([\d,]+)/);
          if (match) {
            const newCount = parseInt(match[1].replace(/,/g, '')) + 1;
            meta[2].textContent = meta[2].textContent.replace(/^[\d,]+/, formatNum(newCount));
          }
        }
      }
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '참여하기';
      if (e.status === 409) {
        btn.className = 'quest-join-btn joined';
        btn.textContent = '참여중';
        btn.disabled = true;
      } else {
        alert(e.message || '참여 실패');
      }
    }
  }

  authRestore().then(() => { initCommon(); loadCampaign(); });
</script>
</body>
</html>
