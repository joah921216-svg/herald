<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign — SHILL VAULT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<nav id="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo"><div class="logo-mark">SV</div><span class="logo-name">SHILL VAULT</span></a>
    <button class="mob-toggle" onclick="$('.nav-links')?.classList.toggle('active')" aria-label="Menu">&#9776;</button>
    <ul class="nav-links"></ul>
  </div>
</nav>

<div class="detail-wrap">
  <a href="index.html#campaigns" class="detail-back">&larr; 캠페인 목록</a>

  <div id="loading" class="dash-loading"><div class="spinner"></div></div>

  <div id="content" style="display:none;">
    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;">
      <div class="tr-picon" id="campIcon" style="width:44px;height:44px;font-size:0.85rem;"></div>
      <div>
        <h1 class="detail-title" id="campName"></h1>
        <div class="detail-meta">
          <span id="campChain"></span>
          <span id="campCategory"></span>
          <span id="campStatus"></span>
        </div>
      </div>
    </div>

    <p id="campDesc" style="font-size:0.9rem;color:var(--text-2);margin-bottom:1.5rem;line-height:1.65;"></p>

    <!-- Stats -->
    <div class="dash-stats" style="grid-template-columns:repeat(4,1fr);">
      <div class="dash-stat">
        <div class="dash-stat-label">참여자</div>
        <div class="dash-stat-value" id="campParticipants">0</div>
      </div>
      <div class="dash-stat">
        <div class="dash-stat-label">보상 풀</div>
        <div class="dash-stat-value" id="campReward">$0</div>
      </div>
      <div class="dash-stat">
        <div class="dash-stat-label">퀘스트</div>
        <div class="dash-stat-value" id="campQuestCount">0</div>
      </div>
      <div class="dash-stat">
        <div class="dash-stat-label">기간</div>
        <div class="dash-stat-value" id="campPeriod" style="font-size:0.9rem;">-</div>
      </div>
    </div>

    <!-- Quests -->
    <div class="dash-card">
      <div class="dash-card-title">퀘스트 목록 <span class="count" id="questCountBadge">0</span></div>
      <div class="quest-list" id="questList"></div>
      <div id="questEmpty" class="dash-empty" style="display:none;">
        <div class="dash-empty-icon">&#128270;</div>
        <p>등록된 퀘스트가 없습니다.</p>
      </div>
    </div>
  </div>

  <div id="notFound" style="display:none;">
    <div class="dash-empty">
      <div class="dash-empty-icon">&#128533;</div>
      <p>캠페인을 찾을 수 없습니다.</p>
      <a href="index.html" class="btn btn-ghost" style="margin-top:1rem;">홈으로</a>
    </div>
  </div>
</div>

<!-- Wallet Modal -->
<div class="modal-overlay" id="walletModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('walletModal')">&times;</button>
    <div id="walletConnect">
      <h3>지갑 연결</h3>
      <p class="modal-desc">지갑을 연결하여 퀘스트에 참여하세요.</p>
      <div class="wallet-options" id="walletOptions"></div>
      <div id="walletError" class="wallet-error" style="display:none;"></div>
    </div>
    <div id="walletRegister" style="display:none;"></div>
    <div id="walletInfo" style="display:none;">
      <h3>지갑 연결됨</h3>
      <p class="modal-desc" id="wiAddr"></p>
      <button class="wallet-disconnect-btn" onclick="doDisconnect()">연결 해제</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const campaignId = params.get('id');

  // Quest type → emoji mapping
  const QUEST_EMOJI = {
    twitter_follow: '🐦', twitter_rt: '🔁', telegram_join: '✈️', discord_join: '💬',
    token_swap: '🔄', staking: '📌', nft_mint: '🎨',
    review: '📝', youtube_video: '🎬', twitter_thread: '🧵',
  };
  const ACTION_LABELS = {
    twitter_follow: '트위터 팔로우', twitter_rt: 'RT & 좋아요', telegram_join: '텔레그램 가입',
    discord_join: '디스코드 참여', token_swap: '스왑 체험', staking: '스테이킹', nft_mint: 'NFT 민팅',
    review: '리뷰 작성', youtube_video: '유튜브 영상', twitter_thread: '트위터 스레드',
  };

  let myParticipations = {}; // questId -> status

  async function loadMyParticipations() {
    if (!Auth.isLoggedIn) return;
    try {
      const data = await api('/api/users/me/participations');
      if (Array.isArray(data)) {
        data.forEach(p => { myParticipations[p.quest_id] = p.status; });
      }
    } catch { /* not logged in or error */ }
  }

  async function loadCampaign() {
    if (!campaignId) { hide('#loading'); show('#notFound'); return; }
    try {
      const [camp] = await Promise.all([
        api('/api/campaigns/' + campaignId),
        loadMyParticipations(),
      ]);
      hide('#loading');
      show('#content');

      const abbr = (camp.project_name || '').slice(0, 2).toUpperCase();
      const gradients = ['#6366f1,#818cf8','#f59e0b,#fbbf24','#ec4899,#f472b6','#22d3ee,#06b6d4'];
      const grad = gradients[camp.project_name?.length % gradients.length || 0];
      $('#campIcon').style.background = 'linear-gradient(135deg,' + grad + ')';
      $('#campIcon').textContent = abbr;
      $('#campName').textContent = camp.project_name;
      $('#campChain').textContent = camp.chain || '-';
      $('#campCategory').textContent = camp.category || '-';
      $('#campStatus').innerHTML = statusBadge(camp.status);
      if (camp.description) $('#campDesc').textContent = camp.description;
      else hide('#campDesc');
      $('#campParticipants').textContent = formatNum(camp.current_participants) + (camp.max_participants ? ' / ' + formatNum(camp.max_participants) : '');
      $('#campReward').textContent = '$' + formatNum(camp.reward_amount);
      $('#campPeriod').textContent = formatDate(camp.start_date) + ' ~ ' + formatDate(camp.end_date);

      // Set page title
      document.title = (camp.project_name || 'Campaign') + ' — SHILL VAULT';

      const quests = camp.quests || [];
      $('#campQuestCount').textContent = quests.length;
      $('#questCountBadge').textContent = quests.length;

      if (quests.length === 0) {
        show('#questEmpty');
      } else {
        renderQuests(quests);
      }
    } catch (e) {
      hide('#loading');
      show('#notFound');
    }
  }

  function renderQuests(quests) {
    const list = $('#questList');
    list.innerHTML = '';
    quests.forEach(q => {
      const emoji = QUEST_EMOJI[q.action_type] || '📋';
      const typeClass = 'quest-type-' + (q.quest_type || 'social');
      const actionLabel = ACTION_LABELS[q.action_type] || q.action_type || q.quest_type || '-';
      const myStatus = myParticipations[q.id];

      let btnHtml;
      if (myStatus === 'completed' || myStatus === 'rewarded') {
        btnHtml = '<button class="quest-join-btn completed" disabled>완료</button>';
      } else if (myStatus === 'joined') {
        btnHtml = '<button class="quest-join-btn joined" disabled>참여중</button>';
      } else if (!Auth.isLoggedIn) {
        btnHtml = '<button class="quest-join-btn connect" onclick="openModal(\'walletModal\')">지갑 연결</button>';
      } else {
        btnHtml = '<button class="quest-join-btn" onclick="joinQuest(\'' + q.id + '\', this)">참여하기</button>';
      }

      const item = document.createElement('div');
      item.className = 'quest-item';
      item.id = 'quest-' + q.id;
      item.innerHTML = `
        <div class="quest-type-badge ${typeClass}">${emoji}</div>
        <div class="quest-item-body">
          <div class="quest-item-title">${q.title || q.name || actionLabel}</div>
          <div class="quest-item-meta">
            <span>${actionLabel}</span>
            <span>${q.reward_per_user ? '$' + q.reward_per_user : '-'} 보상</span>
            <span>${formatNum(q.current_participants)}${q.max_participants ? ' / ' + formatNum(q.max_participants) : ''}명</span>
          </div>
        </div>
        ${btnHtml}`;
      list.appendChild(item);
    });
  }

  async function joinQuest(questId, btn) {
    btn.disabled = true;
    btn.textContent = '참여 중...';
    try {
      await api('/api/quests/' + questId + '/join', { method: 'POST' });
      btn.className = 'quest-join-btn joined';
      btn.textContent = '참여중';
      myParticipations[questId] = 'joined';
      // Update participant count in the quest item
      const item = document.getElementById('quest-' + questId);
      if (item) {
        const meta = item.querySelectorAll('.quest-item-meta span');
        if (meta[2]) {
          const match = meta[2].textContent.match(/^([\d,]+)/);
          if (match) {
            const newCount = parseInt(match[1].replace(/,/g, '')) + 1;
            meta[2].textContent = meta[2].textContent.replace(/^[\d,]+/, formatNum(newCount));
          }
        }
      }
      // Update campaign participants
      const el = $('#campParticipants');
      if (el) {
        const match = el.textContent.match(/^([\d,]+)/);
        if (match) {
          const newCount = parseInt(match[1].replace(/,/g, '')) + 1;
          el.textContent = el.textContent.replace(/^[\d,]+/, formatNum(newCount));
        }
      }
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '참여하기';
      if (e.status === 409) {
        btn.className = 'quest-join-btn joined';
        btn.textContent = '참여중';
        btn.disabled = true;
      } else {
        alert(e.message || '참여 실패');
      }
    }
  }

  // Wallet connect
  async function connectWallet(type) {
    const provider = findProviderByName(type);
    const walletName = WALLET_INFO[type]?.name || type;
    if (!provider) { $('#walletError').textContent = walletName + '이(가) 감지되지 않습니다.'; show('#walletError'); return; }
    try {
      const result = await authConnect(provider, walletName);
      if (result.needsRegistration) {
        showRegForm(result.nonce, result.addr, provider);
      } else {
        closeModal('walletModal');
        setupNav();
        location.reload();
      }
    } catch (e) {
      $('#walletError').textContent = e.message || '연결 실패';
      show('#walletError');
    }
  }

  function showRegForm(nonce, addr, provider) {
    hide('#walletConnect');
    let selectedRole = 'user';
    $('#walletRegister').innerHTML = `
      <h3>회원가입</h3>
      <p class="modal-desc">${shortAddr(addr)} 지갑으로 가입합니다.</p>
      <div class="auth-reg">
        <div class="auth-role-picker">
          <button class="auth-role-opt selected" data-role="user" onclick="selectRegRole(this)">
            <span class="auth-role-icon">&#128100;</span>
            <span class="auth-role-name">일반 유저</span>
            <span class="auth-role-desc">퀘스트 참여 및 보상</span>
          </button>
          <button class="auth-role-opt" data-role="project" onclick="selectRegRole(this)">
            <span class="auth-role-icon">&#128188;</span>
            <span class="auth-role-name">프로젝트</span>
            <span class="auth-role-desc">캠페인 생성 및 관리</span>
          </button>
        </div>
        <div class="reg-field"><label>이메일 (선택)</label><input type="email" id="regEmail" placeholder="name@example.com"></div>
        <div class="reg-field" id="regProjField" style="display:none;"><label>프로젝트 이름</label><input type="text" id="regProjName" placeholder="예: AxiomDEX"></div>
        <button class="reg-btn" onclick="submitReg()">가입하기</button>
      </div>
    `;
    show('#walletRegister');

    window._regData = { nonce, addr, provider };
    window.selectRegRole = function(el) {
      $$('.auth-role-opt').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      selectedRole = el.dataset.role;
      document.getElementById('regProjField').style.display = selectedRole === 'project' ? '' : 'none';
    };
    window.submitReg = async function() {
      try {
        const regData = { role: selectedRole, email: $('#regEmail')?.value || undefined };
        if (selectedRole === 'project') regData.project_name = $('#regProjName')?.value || undefined;
        await authSign(addr, nonce, provider, regData);
        closeModal('walletModal');
        setupNav();
        location.reload();
      } catch (e) { alert(e.message || '가입 실패'); }
    };
  }

  // Init
  authRestore().then(() => { initCommon(); loadCampaign(); });
</script>
</body>
</html>
